spring.application.name=AdiMemoryMesh

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql-103ade1-emailforproject659-36f2.f.aivencloud.com:19263/defaultdb?sslMode=REQUIRED&enabledTLSProtocols=TLSv1.2,TLSv1.3}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:avnadmin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:AVNS_XFtyjMscx_XHPj225vQ}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP pool stability for Aiven Cloud MySQL (prevents closed/stale connection errors)
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.max-lifetime=180000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=5

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Multipart upload limits for bulk college photo uploads
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=100MB

# Python Face Recognition Engine (set FACE_ENGINE_URL on Render if hosted separately)
face-engine.url=${FACE_ENGINE_URL:http://127.0.0.1:8001}
face-engine.match-threshold=0.45

