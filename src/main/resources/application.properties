spring.application.name=AdiMemoryMesh

# MySQL configuration (local MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/adimemorymesh_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Multipart upload limits for bulk college photo uploads
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=100MB
# Python Face Recognition Engine
face-engine.url=http://127.0.0.1:8001
face-engine.match-threshold=0.45

# Cloudinary timeouts and credentials (prefer environment variables in production/public repos)
cloudinary.connect-timeout=30000
cloudinary.read-timeout=60000
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:t4pwzvru}
cloudinary.api-key=${CLOUDINARY_API_KEY:247577139243459}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:sY5sXyaPHKQJJEIUQj0cNOXqOW0}